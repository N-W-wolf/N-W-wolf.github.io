<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">轴角表示和单位四元数</title><desc id="desc">向量绕单位轴 u 旋转 theta，映射为标量 cos theta over two 和向量 u sin theta over two 组成的四元数。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#222"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#d85d32"/></marker><style>.bg{fill:#f7f6f2;stroke:#c7c5bd;stroke-width:2}.axis{stroke:#222;stroke-width:5;marker-end:url(#a)}.v{stroke:#287b96;stroke-width:5;marker-end:url(#a)}.arc{fill:none;stroke:#d85d32;stroke-width:5;marker-end:url(#r)}.map{stroke:#777974;stroke-width:3;marker-end:url(#a)}.card{fill:#fff;stroke:#bdbbb4;stroke-width:2}.t{font-family:sans-serif;font-size:24px;font-weight:700;fill:#222}.s{font-family:sans-serif;font-size:18px;fill:#62645f}.m{font-family:serif;font-size:23px;fill:#222}.accent{fill:#b84725}</style></defs>
  <rect class="bg" x="18" y="18" width="924" height="394" rx="18"/>
  <g transform="translate(205 235)"><ellipse cx="0" cy="0" rx="125" ry="62" fill="none" stroke="#c7c5bd" stroke-width="2" stroke-dasharray="7 7" transform="rotate(-18)"/><line class="axis" x1="-75" y1="90" x2="85" y2="-130"/><text class="m" x="92" y="-132">u</text><line class="v" x1="0" y1="0" x2="120" y2="42"/><line class="v" x1="0" y1="0" x2="64" y2="-82" opacity=".48"/><path class="arc" d="M105 37 A110 74 0 0 0 63 -78"/><text class="m accent" x="115" y="-40">θ</text></g>
  <text class="t" x="88" y="70">轴角表示</text><text class="s" x="88" y="98">单位轴 u + 旋转角 θ</text>
  <line class="map" x1="390" y1="215" x2="515" y2="215"/><text class="s" x="407" y="190">编码</text>
  <rect class="card" x="550" y="83" width="330" height="264" rx="14"/><text class="t" x="588" y="127">单位四元数</text><text class="m" x="588" y="184">q = [ w,   r<tspan baseline-shift="super" font-size="14">T</tspan> ]<tspan baseline-shift="super" font-size="14">T</tspan></text><line x1="585" y1="205" x2="844" y2="205" stroke="#d1cfc7" stroke-width="2"/><text class="m" x="588" y="249">w = cos(θ/2)</text><text class="m" x="588" y="296">r = u sin(θ/2)</text><text class="s" x="588" y="329">标量部分 + 向量部分</text>
</svg>
