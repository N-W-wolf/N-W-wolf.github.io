<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">点的位置坐标变换</title><desc id="desc">先将点在机身坐标系中的位置旋转到世界坐标轴方向，再加上机身原点相对世界原点的平移。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#222"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#d85d32"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#287b96"/></marker><style>.bg{fill:#f7f6f2;stroke:#c7c5bd;stroke-width:2}.axis{stroke:#222;stroke-width:3;marker-end:url(#a)}.trans{stroke:#287b96;stroke-width:5;marker-end:url(#b)}.local{stroke:#d85d32;stroke-width:5;marker-end:url(#r)}.sum{stroke:#222;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#a)}.t{font-family:sans-serif;font-size:20px;fill:#222}.s{font-family:sans-serif;font-size:17px;fill:#62645f}.m{font-family:serif;font-size:20px;fill:#222}</style></defs>
  <rect class="bg" x="18" y="18" width="924" height="444" rx="18"/>
  <g transform="translate(125 375)"><line class="axis" x1="0" y1="0" x2="250" y2="0"/><line class="axis" x1="0" y1="0" x2="0" y2="-265"/><text class="m" x="260" y="7">x<tspan baseline-shift="sub" font-size="13">W</tspan></text><text class="m" x="-22" y="-275">y<tspan baseline-shift="sub" font-size="13">W</tspan></text></g>
  <line class="trans" x1="125" y1="375" x2="465" y2="285"/><text class="m" x="275" y="305">t<tspan baseline-shift="super" font-size="13">W</tspan><tspan baseline-shift="sub" font-size="13">B</tspan></text>
  <g transform="translate(465 285) rotate(-28)"><line class="local" x1="0" y1="0" x2="210" y2="0"/><line class="local" x1="0" y1="0" x2="0" y2="-155"/><text x="218" y="8" font-family="serif" font-style="italic" font-size="20" fill="#b84725">x<tspan baseline-shift="sub" font-size="13">B</tspan></text><text x="-20" y="-165" font-family="serif" font-style="italic" font-size="20" fill="#b84725">y<tspan baseline-shift="sub" font-size="13">B</tspan></text></g>
  <line class="local" x1="465" y1="285" x2="680" y2="155"/><circle cx="680" cy="155" r="9" fill="#222"/><text class="t" x="698" y="150">P</text><text class="m" x="545" y="190">R<tspan baseline-shift="super" font-size="13">W</tspan><tspan baseline-shift="sub" font-size="13">B</tspan> p<tspan baseline-shift="super" font-size="13">B</tspan><tspan baseline-shift="sub" font-size="13">P</tspan></text>
  <line class="sum" x1="125" y1="375" x2="680" y2="155"/><text class="m" x="715" y="245">p<tspan baseline-shift="super" font-size="13">W</tspan><tspan baseline-shift="sub" font-size="13">P</tspan> = R p + t</text><text class="s" x="715" y="282">旋转局部坐标</text><text class="s" x="715" y="310">再加原点偏移</text>
</svg>
