<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">滚转、俯仰和偏航</title><desc id="desc">三个面板分别展示机器人绕机身 x、y、z 轴旋转。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#d85d32"/></marker><style>.p{fill:#f7f6f2;stroke:#c7c5bd;stroke-width:2}.body{fill:#222}.wheel{fill:#6c6e69}.axis{stroke:#287b96;stroke-width:4;stroke-dasharray:7 6}.arc{fill:none;stroke:#d85d32;stroke-width:5;marker-end:url(#a)}.t{font-family:sans-serif;font-size:24px;font-weight:700;fill:#222}.s{font-family:sans-serif;font-size:17px;fill:#62645f}.m{font-family:serif;font-size:19px;fill:#287b96}</style></defs>
  <rect class="p" x="15" y="15" width="290" height="330" rx="18"/><rect class="p" x="335" y="15" width="290" height="330" rx="18"/><rect class="p" x="655" y="15" width="290" height="330" rx="18"/>
  <g transform="translate(160 177)"><rect class="body" x="-72" y="-43" width="144" height="86" rx="18"/><circle class="wheel" cx="-50" cy="-51" r="10"/><circle class="wheel" cx="50" cy="-51" r="10"/><circle class="wheel" cx="-50" cy="51" r="10"/><circle class="wheel" cx="50" cy="51" r="10"/><line class="axis" x1="-120" y1="0" x2="120" y2="0"/><path class="arc" d="M-5 -95 A96 70 0 1 1 -70 -58"/></g><text class="t" x="116" y="60">Roll</text><text class="m" x="148" y="88">x</text><text class="s" x="75" y="315">绕机身前向轴翻滚</text>
  <g transform="translate(480 177)"><rect class="body" x="-72" y="-43" width="144" height="86" rx="18"/><circle class="wheel" cx="-50" cy="-51" r="10"/><circle class="wheel" cx="50" cy="-51" r="10"/><circle class="wheel" cx="-50" cy="51" r="10"/><circle class="wheel" cx="50" cy="51" r="10"/><line class="axis" x1="0" y1="-118" x2="0" y2="118"/><path class="arc" d="M-96 -5 A70 96 0 1 1 -58 70"/></g><text class="t" x="432" y="60">Pitch</text><text class="m" x="492" y="88">y</text><text class="s" x="385" y="315">绕机身横向轴俯仰</text>
  <g transform="translate(800 177)"><rect class="body" x="-72" y="-43" width="144" height="86" rx="18"/><circle class="wheel" cx="-50" cy="-51" r="10"/><circle class="wheel" cx="50" cy="-51" r="10"/><circle class="wheel" cx="-50" cy="51" r="10"/><circle class="wheel" cx="50" cy="51" r="10"/><circle cx="0" cy="0" r="7" fill="#287b96"/><circle cx="0" cy="0" r="15" fill="none" stroke="#287b96" stroke-width="3"/><path class="arc" d="M-78 -78 A110 110 0 1 1 -102 42"/></g><text class="t" x="760" y="60">Yaw</text><text class="m" x="817" y="88">z</text><text class="s" x="706" y="315">绕机身竖直轴偏航</text>
</svg>
