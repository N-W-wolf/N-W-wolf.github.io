<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Turtlesim 的 ROS 图</title>
  <desc id="desc">键盘控制节点经由速度话题向仿真节点发布消息，仿真节点同时发布位姿和颜色传感器数据。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#202020"/>
    </marker>
    <style>
      .bg{fill:#fafafa}.toolbar{fill:#ececec}.node{fill:#fff;stroke:#151515;stroke-width:3}.topic{fill:#e9e6df;stroke:#656565;stroke-width:2}.title{font-family:sans-serif;font-size:30px;font-weight:700;fill:#111}.text{font-family:sans-serif;font-size:23px;font-weight:600;fill:#151515}.small{font-family:sans-serif;font-size:18px;fill:#666}.line{stroke:#202020;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="560"/>
  <rect class="toolbar" width="1280" height="78"/>
  <circle cx="32" cy="39" r="7" fill="#888"/><text class="title" x="55" y="50">Node Graph</text>
  <text class="small" x="1060" y="46">Nodes / Topics</text>

  <ellipse class="node" cx="214" cy="287" rx="150" ry="58"/>
  <text class="text" x="214" y="296" text-anchor="middle">/teleop_turtle</text>

  <rect class="topic" x="454" y="246" width="280" height="82" rx="7"/>
  <text class="text" x="594" y="281" text-anchor="middle">/turtle1/cmd_vel</text>
  <text class="small" x="594" y="309" text-anchor="middle">geometry_msgs/msg/Twist</text>

  <ellipse class="node" cx="942" cy="287" rx="136" ry="58"/>
  <text class="text" x="942" y="296" text-anchor="middle">/turtlesim</text>

  <path class="line" d="M364 287 H446"/>
  <path class="line" d="M734 287 H798"/>

  <rect class="topic" x="1030" y="130" width="210" height="66" rx="7"/>
  <text class="text" x="1135" y="158" text-anchor="middle">/turtle1/pose</text>
  <text class="small" x="1135" y="182" text-anchor="middle">Pose</text>
  <path class="line" d="M1012 250 C1070 225 1080 210 1096 198"/>

  <rect class="topic" x="1030" y="378" width="210" height="66" rx="7"/>
  <text class="text" x="1135" y="406" text-anchor="middle" style="font-size:19px">/turtle1/color_sensor</text>
  <text class="small" x="1135" y="430" text-anchor="middle">Color</text>
  <path class="line" d="M1012 324 C1070 348 1080 363 1096 376"/>

  <text class="small" x="64" y="510">椭圆表示 Node，矩形表示 Topic，箭头表示消息流向。该图按本机 ROS 2 Humble 的运行关系整理。</text>
</svg>
