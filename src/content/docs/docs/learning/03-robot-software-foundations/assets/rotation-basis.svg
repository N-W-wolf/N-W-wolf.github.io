<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">二维坐标系旋转与基向量</title><desc id="desc">坐标系 B 相对 W 旋转角度 theta，B 的两个基向量构成从 B 到 W 的旋转矩阵的两列。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#222"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#d85d32"/></marker><style>.bg{fill:#f7f6f2;stroke:#c7c5bd;stroke-width:2}.w{stroke:#222;stroke-width:3;marker-end:url(#a)}.b{stroke:#d85d32;stroke-width:5;marker-end:url(#r)}.guide{stroke:#898b85;stroke-width:2;stroke-dasharray:7 7}.t{font-family:sans-serif;font-size:22px;fill:#222}.s{font-family:sans-serif;font-size:18px;fill:#62645f}.m{font-family:serif;font-size:22px;fill:#222}.mr{font-family:serif;font-size:22px;fill:#b84725}</style></defs>
  <rect class="bg" x="18" y="18" width="864" height="464" rx="18"/>
  <g transform="translate(260 370)"><line class="w" x1="0" y1="0" x2="240" y2="0"/><line class="w" x1="0" y1="0" x2="0" y2="-255"/><text class="m" x="248" y="9">x<tspan baseline-shift="sub" font-size="14">W</tspan></text><text class="m" x="-25" y="-265">y<tspan baseline-shift="sub" font-size="14">W</tspan></text><g transform="rotate(-35)"><line class="b" x1="0" y1="0" x2="210" y2="0"/><line class="b" x1="0" y1="0" x2="0" y2="-210"/><text class="mr" x="218" y="8">e<tspan baseline-shift="super" font-size="14">B</tspan><tspan baseline-shift="sub" font-size="14">x</tspan></text><text class="mr" x="-22" y="-220">e<tspan baseline-shift="super" font-size="14">B</tspan><tspan baseline-shift="sub" font-size="14">y</tspan></text></g><path d="M92 0 A92 92 0 0 0 75 -53" fill="none" stroke="#d85d32" stroke-width="3"/><text class="mr" x="95" y="-30">θ</text></g>
  <line class="guide" x1="432" y1="250" x2="432" y2="370"/><line class="guide" x1="260" y1="250" x2="432" y2="250"/>
  <text class="t" x="570" y="125">旋转矩阵的列</text><text class="s" x="570" y="168">第 1 列：B 的 x 轴在 W 中的表达</text><text class="s" x="570" y="202">第 2 列：B 的 y 轴在 W 中的表达</text>
  <text class="m" x="570" y="275">R = [ e<tspan baseline-shift="super" font-size="14">B</tspan><tspan baseline-shift="sub" font-size="14">x</tspan>   e<tspan baseline-shift="super" font-size="14">B</tspan><tspan baseline-shift="sub" font-size="14">y</tspan> ]</text><text class="s" x="570" y="325">每一列都是一个单位基向量</text><text class="s" x="570" y="357">两列互相垂直，因此 R⁻¹ = Rᵀ</text>
</svg>
