  <text x="195" y="360" text-anchor="middle" font-size="22" fill="#555" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial">给定策略</text>
  <text x="1150" y="360" text-anchor="middle" font-size="22" fill="#555" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial">最优性条件</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5a6e82"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7a7a7a"/>
    </marker>
  </defs>

  <rect x="70" y="450" rx="18" ry="18" width="250" height="92" fill="#1f77b4"/>
  <rect x="365" y="450" rx="18" ry="18" width="250" height="92" fill="#1f77b4"/>
  <rect x="660" y="450" rx="18" ry="18" width="250" height="92" fill="#1f77b4"/>
  <rect x="980" y="450" rx="18" ry="18" width="340" height="92" fill="#1f77b4"/>
  <rect x="1460" y="450" rx="18" ry="18" width="250" height="92" fill="#1f77b4"/>

  <text x="195" y="505" text-anchor="middle" font-size="28" fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial">贝尔曼方程</text>
  <text x="490" y="505" text-anchor="middle" font-size="28" fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial">策略评估</text>
  <text x="785" y="505" text-anchor="middle" font-size="28" fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial">策略改进</text>
  <text x="1150" y="505" text-anchor="middle" font-size="28" fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial">贝尔曼最优方程</text>
  <text x="1585" y="505" text-anchor="middle" font-size="28" fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial">值迭代</text>

  <line x1="320" y1="496" x2="365" y2="496" stroke="#5a6e82" stroke-width="7" marker-end="url(#arrow)"/>
  <line x1="615" y1="496" x2="660" y2="496" stroke="#5a6e82" stroke-width="7" marker-end="url(#arrow)"/>
  <line x1="910" y1="496" x2="980" y2="496" stroke="#5a6e82" stroke-width="7" marker-end="url(#arrow)"/>
  <line x1="1320" y1="496" x2="1460" y2="496" stroke="#5a6e82" stroke-width="7" marker-end="url(#arrow)"/>

  <text x="640" y="635" text-anchor="middle" font-size="22" fill="#555" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial">策略迭代 = 策略评估 + 策略改进</text>
  <line x1="890" y1="600" x2="405" y2="600" stroke="#7a7a7a" stroke-width="5" marker-end="url(#arrowGray)"/>
  <line x1="405" y1="600" x2="405" y2="545" stroke="#7a7a7a" stroke-width="5"/>
  <line x1="890" y1="545" x2="890" y2="600" stroke="#7a7a7a" stroke-width="5"/>
