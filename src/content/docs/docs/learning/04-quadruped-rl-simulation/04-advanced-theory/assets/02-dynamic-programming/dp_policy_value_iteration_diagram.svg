<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
  <rect width="100%" height="100%" fill="white"/>
  <text x="900.0" y="95" text-anchor="middle" font-size="34" fill="#222" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial">动态规划：贝尔曼方程、策略迭代与值迭代</text>

  <line x1="930" y1="250" x2="930" y2="700" stroke="#b0b0b0" stroke-width="3"/>
