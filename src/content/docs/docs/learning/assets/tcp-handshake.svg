<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" role="img">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="560" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- 双方 -->
  <rect x="100" y="28" width="140" height="58" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="170" y="52" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">客户端</text>
  <text x="170" y="72" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">你的电脑</text>

  <rect x="570" y="28" width="140" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="640" y="52" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#b45309">服务端</text>
  <text x="640" y="72" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">机器人 / 服务器</text>

  <line x1="170" y1="86" x2="170" y2="472" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="640" y1="86" x2="640" y2="472" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 三次握手 -->
  <text x="32" y="112" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">三次握手：建立连接</text>

  <line x1="170" y1="138" x2="633" y2="138" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="405" y="128" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">① SYN：我想和你建立连接（seq = x）</text>

  <line x1="640" y1="178" x2="177" y2="178" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="405" y="168" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">② SYN + ACK：好的，请确认（seq = y，ack = x + 1）</text>

  <line x1="170" y1="218" x2="633" y2="218" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="405" y="208" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">③ ACK：确认，开始传输（ack = y + 1）</text>

  <text x="405" y="250" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#16a34a">连接建立，双方开始可靠地收发数据</text>

  <!-- 四次挥手 -->
  <text x="32" y="296" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#b45309">四次挥手：关闭连接</text>

  <line x1="170" y1="322" x2="633" y2="322" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="405" y="312" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">① FIN：我这边数据发完了，想关闭连接</text>

  <line x1="640" y1="362" x2="177" y2="362" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="405" y="352" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">② ACK：收到，但让我把剩余数据发完</text>

  <line x1="640" y1="402" x2="177" y2="402" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="405" y="392" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">③ FIN：我这边也发完了，请关闭</text>

  <line x1="170" y1="442" x2="633" y2="442" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="405" y="432" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">④ ACK：好的，连接关闭</text>

  <text x="405" y="480" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#475569">挥手比握手多一步：收到对方的 FIN 后，自己可能还有数据要发完，所以先 ACK、把剩余数据发完，再发 FIN。</text>

  <text x="405" y="512" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#64748b">seq 是本次发送的数据序号，ack 是“期待对方下次发送的序号”，用于确认与重传。</text>
</svg>
