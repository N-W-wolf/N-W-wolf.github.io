<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img">
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="470" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- 左侧四层 -->
  <rect x="30" y="34" width="390" height="82" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="48" y="62" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">应用层</text>
  <text x="48" y="84" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">为程序提供可直接使用的协议</text>
  <text x="48" y="104" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#475569">HTTP（网页）· SSH（远程登录）· DNS（域名）</text>

  <rect x="30" y="128" width="390" height="82" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="48" y="156" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#166534">传输层</text>
  <text x="48" y="178" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">端到端传输，用端口区分不同程序</text>
  <text x="48" y="198" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#475569">TCP（可靠）· UDP（快速）</text>

  <rect x="30" y="222" width="390" height="82" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="48" y="250" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#b45309">网络层</text>
  <text x="48" y="272" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">跨网络寻址，决定数据送到哪台机器</text>
  <text x="48" y="292" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#475569">IP 地址 · 子网掩码 · 路由 · ARP · DHCP</text>

  <rect x="30" y="316" width="390" height="82" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="48" y="344" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#334155">链路层</text>
  <text x="48" y="366" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">同一网段内完成实际的数据传输</text>
  <text x="48" y="386" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#475569">MAC 地址 · 交换机（以太网 / Wi-Fi）</text>

  <!-- 左右对应箭头 -->
  <line x1="424" y1="75" x2="462" y2="75" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="424" y1="169" x2="462" y2="169" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="424" y1="263" x2="462" y2="263" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-yellow)"/>
  <line x1="424" y1="357" x2="462" y2="357" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-gray)"/>

  <!-- 右侧：发送时从内到外逐层加上的部分 -->
  <text x="470" y="24" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#475569">左、右两列一一对应；发送时从应用数据开始，自内向外逐层封装：</text>

  <rect x="470" y="34" width="480" height="82" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="488" y="66" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">应用数据</text>
  <text x="488" y="90" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#475569">例如一条 HTTP 请求、一条 SSH 命令</text>

  <rect x="470" y="128" width="480" height="82" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="488" y="160" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#166534">TCP / UDP 首部</text>
  <text x="488" y="184" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#475569">目标端口 · 源端口</text>

  <rect x="470" y="222" width="480" height="82" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="488" y="254" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#b45309">IP 首部</text>
  <text x="488" y="278" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#475569">目标 IP · 源 IP</text>

  <rect x="470" y="316" width="480" height="82" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="488" y="348" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#334155">以太网帧头 + 帧尾</text>
  <text x="488" y="372" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#475569">目标 MAC · 源 MAC · 校验</text>

  <text x="490" y="424" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">一个以太网帧 = 帧头 + IP 首部 + TCP/UDP 首部 + 应用数据 + 帧尾；接收时再从外向内逐层拆开。</text>
</svg>
